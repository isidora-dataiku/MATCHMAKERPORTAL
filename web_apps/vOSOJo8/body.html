<link rel="stylesheet" href="/static/public/styles/1.0.0/dku-styles.css" />

<div id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-logo">
        <div class="brand-mark">AC</div>
        <span class="logo-title">Adviseur Co-pilot</span>
      </div>
      <div id="header-status" class="header-status"></div>
    </div>
  </header>

  <!-- Fallback banner -->
  <div id="fallback-banner" class="fallback-banner hidden">
    Fallback modus — AI-agent niet beschikbaar. Resultaten zijn gebaseerd op vaardigheidsoverlap.
  </div>

  <main class="app-main">
    <!-- Left panel: search + kandidaatkaart -->
    <aside class="panel-left">
      <section class="search-section">
        <h2>Kandidaat zoeken</h2>
        <div class="search-row">
          <input type="text" id="candidate-input" placeholder="Bijv. C-001" autocomplete="off" />
          <button id="search-btn" class="btn-primary">Zoek matches</button>
        </div>
        <div id="search-error" class="error-msg hidden"></div>
      </section>

      <section id="kandidaat-kaart" class="kandidaat-kaart hidden">
        <h3>Kandidaatprofiel</h3>
        <div id="kandidaat-content"></div>
      </section>
    </aside>

    <!-- Right panel: match results -->
    <section class="panel-right">
      <div id="idle-state" class="idle-placeholder">
        <p>Voer een kandidaat-ID in en klik op "Zoek matches" om te beginnen.</p>
      </div>
      <div id="loading-state" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Agent analyseert matches...</p>
      </div>
      <div id="results-state" class="hidden">
        <div class="results-header">
          <h2 id="results-title">Matchresultaten</h2>
          <span id="results-count" class="badge"></span>
        </div>
        <div id="match-cards"></div>
      </div>
    </section>
  </main>
</div>

<!-- Reject modal -->
<div id="reject-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3>Afwijzing registreren</h3>
    <p id="modal-subtitle"></p>
    <div class="field">
      <label for="reden-select">Reden (verplicht)</label>
      <div class="select">
        <select id="reden-select">
          <option value="" disabled selected hidden>Kies een reden...</option>
          <option value="kandidaat_niet_geschikt">Kandidaat niet geschikt</option>
          <option value="vacature_vervuld">Vacature al vervuld</option>
          <option value="kandidaat_niet_geinteresseerd">Kandidaat niet geïnteresseerd</option>
          <option value="locatie_probleem">Locatieprobleem</option>
          <option value="uren_probleem">Uurprobleem</option>
          <option value="overig">Overig</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="toelichting-input">Toelichting (optioneel)</label>
      <textarea id="toelichting-input" rows="3" placeholder="Aanvullende toelichting..."></textarea>
    </div>
    <div class="modal-actions">
      <button id="modal-cancel-btn" class="btn-secondary">Annuleren</button>
      <button id="modal-confirm-btn" class="btn-danger">Afwijzen</button>
    </div>
  </div>
</div>
